# Ansible configuration for the homelab-ansible project.
# Lives at repo root; auto-loaded by ansible-playbook when run from here.

[defaults]
# Where to find roles. Looked up before Galaxy roles.
roles_path = ./roles

# Inventory is passed explicitly per target (sandbox/staging/prod) via -i
# or via the ./homelab wrapper script, so no default set here.
# inventory = ./inventory

# Don't litter the repo with *.retry files when a play fails.
retry_files_enabled = false

# Pretty YAML output instead of JSON-ish dicts.
stdout_callback = yaml

# Enable timing info so you can see which tasks are slow.
callbacks_enabled = profile_tasks

# Cache facts between runs to speed up re-deploys.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts_cache
fact_caching_timeout = 7200

# Pis run Debian; let Ansible pick the right interpreter without warning.
interpreter_python = auto_silent

# Don't prompt about new SSH host keys on fresh SD cards / VMs.
# Safe here because targets are on your LAN / hotspot, not the open internet.
host_key_checking = false

# Show file diffs on changes by default (good for templates/configs).
[diff]
always = true

[ssh_connection]
# Massive speedup: avoid re-running sudo per module by piping commands.
# Requires `requiretty` to be OFF in sudoers (default on Debian/Ubuntu).
pipelining = true

# Reuse SSH connections across tasks. Short control path avoids the 104-char
# UNIX socket length limit when target hostnames are long.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%h-%%r

[privilege_escalation]
become = true
become_method = sudo
become_user = root
